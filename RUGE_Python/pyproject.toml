[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruge-python"
version = "0.1.0"
description = "PyTorch RUGE ComplEx and RotatE implementations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "tqdm>=4.66",
]

[project.scripts]
ruge-preprocess = "ruge_python.preprocess:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ruge_python*"]
